# Single hardcode location for the CLEAR experiment.
#
# Read by:
#   - amplitudes_CLEAR.ipynb / simulazione.jl  (Julia model; times in us,
#     angular frequencies in us^-1)
#   - clear_config.py -> SETUP  (Python; everything else derives from here)
#
# Nothing in the Python scripts should redefine any of these values.


# --- Resonator -------------------------------------------------------------

# Resonator linewidth: enter 2*pi*(linewidth in MHz), i.e. kappa/2pi in MHz.
# From resonator spectroscopy with the qubit in |0>. Do NOT use a separately
# fitted "excited-state kappa": kappa is a property of the resonator, and an
# apparently larger kappa on the excited trace is a mixture of the two
# overlapping Lorentzians caused by T1 decay and preparation error, not a
# physical difference. Refit that trace with two Lorentzians sharing this
# kappa if you want the preparation fidelity out of it.
kappa = 1

# State-dependent resonator frequencies, from the Qibocal dispersive_shift
# experiment. chi/2pi = |f_res_g - f_res_e| / 2 is derived, not entered.
f_res_g_MHz = 7583.8004
f_res_e_MHz = 7582.509

# Probe frequency. This MUST be the midpoint (f_res_g + f_res_e)/2 = 7583.015918:
# only there is the steady-state photon number the same for the two qubit
# states, which is what lets a single Stark calibration serve both. With
# kappa/2pi = 0.747 and chi/2pi = 0.534 MHz, being 134 kHz off the midpoint
# already makes n_g/n_e differ by roughly a factor of 2.
# clear_config warns if this disagrees with the computed midpoint.
f_drive_MHz = 7583.1547


# --- Qubit coherence -------------------------------------------------------

# Relaxation time. Used for the excited-state loss correction when the
# measured excited fraction is unavailable. M1 lasts a good fraction of this,
# so the correction is not a small effect.
t1_us = 8.2

# Echo coherence time -> Gamma2 = 1/T2_echo in Eq. (1).
t2_echo_us = 15.0


# --- Readout drive ---------------------------------------------------------

# Target steady-state photon number for the CLEAR pulse.
n_target = 2.0

# Fallback for the Stark slope k in n_photons = k*amp^2 + q, used only if
# data/stark_fit_results.json is missing. Re-run stark_analysis.py with the
# probe at f_drive_MHz above; a k measured at a different probe frequency (or
# on a different resonator) puts the whole photon-number axis off scale.
k_stark_fallback = 1.2201e4


# --- CLEAR pulse shape -----------------------------------------------------
# These are inputs to the Julia model, which writes the resulting segment
# ratios (together with the durations they were computed for) into
# parametri/clear_amplitudes.json. clear_config reads the durations back from
# that JSON, so changing t_kick or t_readout here requires re-running
# amplitudes_CLEAR.ipynb -- the ratios are only valid for the t_kick they
# were solved for.

# Ring-up / ring-down segment duration (~1/kappa; 150 ns in the paper).
t_kick = 0.160

# Steady-state readout segment. Steady state is reached in ~5/kappa ~ 1 us;
# anything much longer only increases the excited-state loss during M1.
t_readout = 1.0

# Resonator initially in vacuum.
alpha0_real = 0.0
alpha0_imag = 0.0


# --- Ramsey / acquisition --------------------------------------------------

# Ramsey detuning, applied as a phase ramp on the second X90.
ramsey_detuning_MHz = 6.0

nshots = 4096
relaxation_time_us = 40.0
t_buffer_ns = 200.0